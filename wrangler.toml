name = "trip-planner-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# staging（頂層）的非機密設定。機密（SESSION_SECRET、OAUTH_SIGNING_PRIVATE_KEY…）不放這裡，由 secrets 管理。
# ENVIRONMENT=preview 是 src/lib/mobile-oauth.ts 的 UAT 契約：只認 tripline-mobile-uat、請求 origin 必須等於 PUBLIC_ORIGIN、
# callback 必須是 /uat/oauth/callback（與 tripline-mobile 的 production callback 分開，避免 staging 與 production 的 app link 互相搶）。
# ⚠ 合併後由 deploy.yml 部署到 staging：PUBLIC_ORIGIN 會改變 issuer、授權導向的 web origin（WEB_ORIGIN 未設時）與信件連結的 origin。
[vars]
ENVIRONMENT = "preview"
PUBLIC_ORIGIN = "https://trip-planner-api.lean-lean.workers.dev"

# 骨架階段（T7）先綁 staging D1，只給 /api/health 做 SELECT 1。
# 正式資料庫與 migration 的歸屬由 T15 處理，切換前不綁 production。
[[d1_databases]]
binding = "DB"
database_name = "trip-planner-db-staging"
database_id = "53f38e2c-e17d-4961-ba9e-f61e63477ecc"
migrations_dir = "migrations"

# T21 切換用的 production 環境（草案）。**不會被目前的部署流程用到**：deploy.yml 仍部署頂層（staging）。
# 切換時以 `wrangler deploy --env production` 與 `wrangler d1 migrations apply DB --env production --remote` 使用，
# 需先設好 secrets（SESSION_SECRET、OAUTH_SIGNING_PRIVATE_KEY、PUBLIC_ORIGIN、WEB_ORIGIN、ALLOWED_ORIGINS）。
# 與舊入口共用同一個 production D1（trip-planner-db）：migration 0099、0100 為 additive，必須先套再切流量。
[env.production]
name = "trip-planner-api-production"

[env.production.vars]
ENVIRONMENT = "production"
PUBLIC_ORIGIN = "https://trip-planner-api-production.lean-lean.workers.dev"
WEB_ORIGIN = "https://trip-planner-dby.pages.dev"
ALLOWED_ORIGINS = "https://trip-planner-dby.pages.dev"

[[env.production.d1_databases]]
binding = "DB"
database_name = "trip-planner-db"
database_id = "d61c42d5-8083-4e18-9b6c-70e133e37322"
migrations_dir = "migrations"

# 外部心跳（trip-planner#1623）：每 10 分鐘查請求是否長時間無人處理，停滯時以 Telegram 告警。
# ⚠ Cron Trigger 只在 production 設定；staging（頂層）刻意不設。deploy.yml 只部署 staging，
#   所以這段要 production 手動 `wrangler deploy --env production` 才會生效。
#   另需 `wrangler secret put TELEGRAM_BOT_TOKEN|TELEGRAM_CHAT_ID --env production`；未設定時 scheduled 靜默。
#
# 清理排程（trip-planner#1627 階段 1）：web 三支 GitHub Actions 清理的等價實作（src/lib/cleanup-cron.ts），
# 頻率沿用原 workflow：rate_limit_buckets 每小時、trip_shares＋孤兒 cloned trips 每日 03:17 UTC、
# trip_invitations 每日 03:00 UTC。cron 字串必須與 cleanup-cron.ts 的常數一致（event.cron 字串比對）。
# 與 web workflow 並行 1 週（皆 idempotent DELETE），確認無誤後 web 端才刪 workflow。
[env.production.triggers]
crons = ["*/10 * * * *", "0 * * * *", "17 3 * * *", "0 3 * * *"]
